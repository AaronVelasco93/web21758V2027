<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Calculadora</h1>
        <form id="conculadora-form">
            <input type="number" id="num1" required placeholder="Ingresa el primer Numero">
            <input type="number" id="num2" required placeholder="Ingresa el segundo Numero">
            <select id="operador">
                    <option value="suma">Sumar (+)</option>
                    <option value="resta">Resta (-)</option>
                    <option value="multiplica">Multiplicacion (*)</option>
                    <option value="divide">Div (/)</option>
            </select>
            <button type="submit" >Calcular</button>

        </form>
        <div id="resultado" >

        </div>
    </div>



</body>
<script src="app.js"></script>
</html>
